name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      # 项目与上游 reader 都可能遇到中文文件名/内容；统一 UTF-8 避免 locale 差异。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装外部评测依赖（仅 Claw-Eval 适配层）
        run: python -m pip install "pydantic>=2" "pyyaml>=6"
      - name: 离线回归（不调用模型、不联网）
        run: python -m unittest discover -s tests -v
      - name: Claw-Eval 固定快照回放（不联网）
        run: python -m ecommerce_agent.claw_eval_adapter --replay tests/fixtures/claw-replay --output runs/claw-replay-ci
