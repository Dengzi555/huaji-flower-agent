<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花迹 · 评测中心</title><link rel="icon" href="/brand-mark.svg"><link rel="stylesheet" href="/eval.css"><script src="/theme.js"></script><script src="/eval.js" defer></script></head>
<body><aside><a class="brand" href="/"><img src="/brand-mark.svg" alt="花迹">花迹<span>评测中心</span></a><nav aria-label="评测导航"><button data-view="runs" class="active">评测任务</button><button data-view="dataset">评测集</button><button data-view="compare">版本对比</button></nav><a class="back" href="/">← 返回经营工作台</a><p class="aside-note">让每次修改，都有据可查。</p><button id="theme-toggle" type="button">切换主题</button></aside>
<main><header><div><p class="eyebrow">HUAJI · EVALUATION</p><h1 id="page-title">看清一次改动的效果。</h1></div><button id="refresh">刷新</button></header><p id="notice" role="status" aria-live="polite"></p>
<section id="access" hidden><label>工作台访问口令<input id="access-token" type="password" autocomplete="off"></label><button id="access-save">连接</button></section>
<section id="runs-view"><form id="launch" class="launch"><div class="section-heading"><h2>新建评测</h2><span id="dataset-version"></span></div><div class="form-grid"><label>版本备注<input id="run-label" maxlength="80" placeholder="例如：优化商品简称识别"></label><label>用例范围<select id="run-split"><option value="regression">回归集</option><option value="holdout">保留集 · 阶段验收</option><option value="all">全部用例</option></select></label><label>运行模式<select id="run-mode"><option value="offline">离线 · 不调用模型</option><option value="live">真实模型规划</option></select></label><label>规划调用预算<input id="run-budget" type="number" min="0" max="30" value="0" disabled></label><label>任务时限（秒）<input id="run-timeout" type="number" min="10" max="900" value="300"></label><button class="primary" type="submit" id="run-start">开始评测 ↗</button></div><p class="muted">运行当前工作区代码并记录指纹；模型网络重试另受运行时预算控制。</p></form>
<div class="section-heading"><h2>运行记录</h2><span id="run-count"></span></div><div id="job-list" class="job-list"></div>
<section id="job-detail" hidden><div class="section-heading"><div><p class="eyebrow">RUN DETAIL</p><h2 id="job-title"></h2></div><button id="cancel-run">停止评测</button></div><p id="job-message"></p><progress id="job-progress" max="1" value="0"></progress><div id="job-metrics" class="metrics"></div><details><summary>查看本轮版本与评分信息</summary><pre id="job-identity"></pre></details><div class="section-heading"><h3>逐题结果</h3><label>筛选<select id="case-filter"><option value="all">全部</option><option value="failed">失败</option><option value="passed">通过</option><option value="skipped">跳过</option></select></label></div><div class="table-wrap"><table><thead><tr><th>题目</th><th>结果</th><th>失败检查</th><th>耗时</th><th>查看</th></tr></thead><tbody id="case-rows"></tbody></table></div></section></section>
<section id="dataset-view" hidden><div class="section-heading"><h2>业务 Golden 集</h2><label>搜索题目<input id="dataset-search" type="search" placeholder="商品、日期、分类…"></label></div><p id="dataset-overview"></p><div id="dataset-list" class="dataset-list"></div></section>
<section id="compare-view" hidden><div class="section-heading"><h2>同条件，比较两个版本。</h2></div><form id="compare-form" class="comparison-form"><label>基线运行<select id="compare-left" required></select></label><label>当前运行<select id="compare-right" required></select></label><button class="primary" type="submit">比较结果</button></form><p class="muted">匹配评测集、分组、数据版本、模式和预算；未完成运行不可直接比较。</p><div id="comparison-result"></div></section>
</main><dialog id="case-dialog"><div class="section-heading"><h2 id="case-title">案例详情</h2><button id="case-close" aria-label="关闭案例详情">关闭</button></div><p id="case-question"></p><div id="case-checks"></div><details open><summary>预期答案与条件</summary><pre id="case-expected"></pre></details><details><summary>实际解析与结果</summary><pre id="case-actual"></pre></details><details><summary>工具证据与执行轨迹</summary><pre id="case-evidence"></pre></details><form id="review-form" hidden><h3>失败案例审核</h3><label>处理状态<select id="review-status"><option value="needs_review">待核查</option><option value="confirmed">已确认问题</option><option value="dismissed">已排除</option></select></label><label>核查说明<textarea id="review-note" maxlength="1000" placeholder="记录原因与后续修改方向"></textarea></label><button class="primary" type="submit">保存审核</button><p class="muted">审核不修改题目答案，也不自动写入向量示例库。</p></form></dialog></body></html>
